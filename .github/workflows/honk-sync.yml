# Keeps the Honk branches current:
#   honk      = upstream main  + Honk patches
#   honk-0.11 = upstream 0.11.x + Honk patches (what Honk consumes until it moves to 0.12)
# Lives on the default branch because scheduled workflows only run from there.
name: honk-sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: honk
            upstream: main
          - branch: honk-0.11
            upstream: 0.11.x
    runs-on: ubuntu-latest
    concurrency: honk-sync-${{ matrix.branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # A conflict or failing test fails the job and leaves the branch untouched.
      - name: Merge upstream ${{ matrix.upstream }}, test, push
        run: |
          set -euo pipefail
          git fetch https://github.com/quinn-rs/quinn ${{ matrix.upstream }}
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "${{ matrix.branch }} already contains upstream ${{ matrix.upstream }}"
            exit 0
          fi
          git -c user.name=honk-sync -c user.email=honk-sync@users.noreply.github.com \
            merge --no-edit FETCH_HEAD
          cargo test -p quinn-proto -p quinn
          git push origin HEAD:${{ matrix.branch }}
